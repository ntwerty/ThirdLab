version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recipes_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-recipes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipes_user} -d ${POSTGRES_DB:-recipes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: recipes_web
    command: >
      sh -c "echo 'Waiting for database...' &&
             until pg_isready -h db -U ${POSTGRES_USER:-recipes_user} -d ${POSTGRES_DB:-recipes_db} -p 5432; do
               echo 'Database is unavailable - sleeping...';
               sleep 2;
             done &&
             echo 'Database is ready!' &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./recipes:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - data_volume:/app/data
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-0kg6jeg(hq8ss9slek!qfd+e&tf#8x38cd3&7(ch$1ow-%_*ng}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${POSTGRES_DB:-recipes_db}
      - DB_USER=${POSTGRES_USER:-recipes_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-recipes_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  data_volume:
    driver: local



